env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mlops-cicd-api

name: CI Pipeline

# pipeline ın ne zaman çalışacağını belirle
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

persmissions:
  contents: read
  packages: write

jobs:
  # ci kontrollerini çalıştır
  ci:
    runs-on: ubuntu-latest

    steps:
      # repo kodlarını runner'a indir
      - name: Repository kodunu al
        uses: actions/checkout@v4

      # python ortamını hazırla
      - name: Python 3.12 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # proje ve test bağımlılıklarının kurulması
      - name: Python bağımlılıklarını kurulması
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # kod kalitesini kontrol et
      - name: Ruff lint kontrolü
        run: ruff check . --fix

      # kod formatını kontrol et
      - name: Ruff format kontrolü
        run: ruff format --check .

      # otomatik testleri çalıştır
      - name: Pytest testlerini çalıştır
        run: python -m pytest
       
      # docker image oluşturma
      - name: Docker image oluştur
        run: | 
          docker build \ 
          -t ${{ env.IMAGE_NAME}}:${{ github.sha }} \
          .
        
      # ghcr authentication adım
      - name: GHCR giriş
        if: github.event_name == 'push'
        run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY}} \
          -u "${{ github.actor }}" \
          --password-stdin 

      # latest tagi
      - name: Latest tag oluştur
        if github.event_name == 'push'
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.IMAGE_NAME }}:latest

      # image ı ghcr ye gönder
      - name: Docker image'ı ghcr ye gönder
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest 


        